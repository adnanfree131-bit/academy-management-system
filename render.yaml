services:
  - type: web
    name: apex-academy-backend
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install -g pnpm@9.15.9 && pnpm install && pnpm -F @apex/shared-types build && pnpm -F @apex/backend build
    startCommand: node packages/backend/dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: AUTH_REDIRECT_URL
        value: https://app.kampus.pk/auth/callback
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: BASE_DOMAIN
        value: kampus.pk
      - key: CLOUDFLARE_PAGES_TARGET
        value: kampus-academy.pages.dev
      - key: CLOUDFLARE_PAGES_PROJECT
        value: kampus-academy
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ZONE_ID
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: BACKUP_EXPORT_TOKEN
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: admissions@apexacademy.edu.pk
      - key: BREVO_SENDER_NAME
        value: Apex Academy ERP
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
