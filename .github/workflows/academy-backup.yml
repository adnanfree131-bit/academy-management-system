name: Nightly academy backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Export live snapshot
        env:
          BACKUP_URL: ${{ secrets.BACKUP_EXPORT_URL }}
          BACKUP_TOKEN: ${{ secrets.BACKUP_EXPORT_TOKEN }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p backups
          curl -fsSL -H "Authorization: Bearer ${BACKUP_TOKEN}" "${BACKUP_URL}" -o /tmp/kampus-backup.json
          date=$(date -u +%Y-%m-%d)
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in /tmp/kampus-backup.json \
            -out "backups/${date}.json.enc" \
            -pass pass:"${BACKUP_PASSPHRASE}"
          rm -f /tmp/kampus-backup.json
      - uses: actions/upload-artifact@v4
        with:
          name: kampus-backup-${{ github.run_id }}
          path: backups/
          retention-days: 30
