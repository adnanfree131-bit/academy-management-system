name: Deploy Render backend

on:
  workflow_dispatch:
    inputs:
      clear_cache:
        description: Clear Render build cache
        type: boolean
        default: true
      logs_only:
        description: Fetch latest Render deploy logs without starting a new deploy
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger and wait for Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          CLEAR_CACHE: ${{ inputs.clear_cache }}
          LOGS_ONLY: ${{ inputs.logs_only }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, sys, time, urllib.error, urllib.parse, urllib.request

          key = os.environ.get("RENDER_API_KEY") or ""
          if not key:
              print("RENDER_API_KEY secret is empty", file=sys.stderr)
              sys.exit(1)

          def req(method, path, body=None):
              data = None if body is None else json.dumps(body).encode()
              request = urllib.request.Request(
                  "https://api.render.com/v1" + path,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + key,
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                      "User-Agent": "kampus-render-deploy",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as resp:
                      raw = resp.read()
                      return resp.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as err:
                  detail = err.read().decode("utf-8", "replace")[:800]
                  print(f"HTTP {err.code} {method} {path}: {detail}", file=sys.stderr)
                  raise

          def dump_logs(owner_id, resource_id, label):
              params = urllib.parse.urlencode({
                  "ownerId": owner_id,
                  "resource": resource_id,
                  "limit": "100",
              })
              try:
                  _, logs = req("GET", "/logs?" + params)
                  print("LOGS", label, "type", type(logs).__name__)
                  text = json.dumps(logs)[:15000]
                  print(text)
              except Exception as err:
                  print("logs_error", label, err, file=sys.stderr)

          _, services = req("GET", "/services?limit=50")
          service = None
          for row in services or []:
              svc = row.get("service") if isinstance(row, dict) and "service" in row else row
              if isinstance(svc, dict) and svc.get("name") == "apex-academy-backend":
                  service = svc
                  break
          if not service:
              print("apex-academy-backend not found", file=sys.stderr)
              sys.exit(1)

          service_id = service.get("id")
          owner_id = service.get("ownerId")
          details = service.get("serviceDetails") or {}
          envd = details.get("envSpecificDetails") or {}
          print("service_id", service_id)
          print("ownerId", owner_id)
          print("rootDir", service.get("rootDir"))
          print("autoDeploy", service.get("autoDeploy"))
          print("branch", service.get("branch"))
          print("repo", service.get("repo"))
          print("runtime", details.get("runtime") or details.get("env"))
          print("current_build", envd.get("buildCommand"))
          print("current_start", envd.get("startCommand"))

          _, deploys = req("GET", f"/services/{service_id}/deploys?limit=5")
          print("recent_deploys")
          for row in deploys or []:
              dep = row.get("deploy") if isinstance(row, dict) and "deploy" in row else row
              if not isinstance(dep, dict):
                  continue
              commit = dep.get("commit") or {}
              print(" ", dep.get("id"), dep.get("status"), dep.get("trigger"), (commit.get("id") or "")[:8], (commit.get("message") or "").splitlines()[0] if commit.get("message") else "")

          if os.environ.get("LOGS_ONLY", "").lower() == "true":
              if owner_id:
                  dump_logs(owner_id, service_id, "service")
                  latest = None
                  for row in deploys or []:
                      dep = row.get("deploy") if isinstance(row, dict) and "deploy" in row else row
                      if isinstance(dep, dict):
                          latest = dep
                          break
                  if latest:
                      dump_logs(owner_id, latest.get("id"), "latest_deploy")
              print("LOGS_ONLY_DONE")
              sys.exit(0)

          build_cmd = "npm install -g pnpm@9.15.9 && pnpm install && pnpm -F @apex/shared-types build && pnpm -F @apex/backend build"
          start_cmd = "node packages/backend/dist/server.js"
          _, updated = req("PATCH", f"/services/{service_id}", {
              "serviceDetails": {
                  "envSpecificDetails": {
                      "buildCommand": build_cmd,
                      "startCommand": start_cmd,
                  }
              }
          })
          envd = ((updated or {}).get("serviceDetails") or {}).get("envSpecificDetails") or {}
          print("patched_build", envd.get("buildCommand"))
          print("patched_start", envd.get("startCommand"))

          clear = os.environ.get("CLEAR_CACHE", "true").lower() != "false"
          _, deploy = req("POST", f"/services/{service_id}/deploys", {
              "clearCache": "clear" if clear else "do_not_clear",
          })
          deploy_id = (deploy or {}).get("id")
          print("deploy_id", deploy_id, "status", (deploy or {}).get("status"))
          if not deploy_id:
              print("no deploy id returned", file=sys.stderr)
              sys.exit(1)

          deadline = time.time() + 20 * 60
          last = ""
          while time.time() < deadline:
              _, info = req("GET", f"/services/{service_id}/deploys/{deploy_id}")
              st = (info or {}).get("status") or ""
              if st != last:
                  print("deploy_status", st)
                  last = st
              if st in {"live", "succeeded", "available"}:
                  print("RENDER_DEPLOY_OK", st)
                  sys.exit(0)
              if st in {"failed", "canceled", "cancelled", "deactivated", "build_failed", "update_failed"}:
                  print("RENDER_DEPLOY_FAILED", st, file=sys.stderr)
                  commit = (info or {}).get("commit") or {}
                  print("failed_commit", commit.get("id"), (commit.get("message") or "").splitlines()[0] if commit.get("message") else "")
                  if owner_id:
                      dump_logs(owner_id, service_id, "service")
                      dump_logs(owner_id, deploy_id, "deploy")
                  sys.exit(1)
              time.sleep(15)
          print("RENDER_DEPLOY_TIMEOUT", last, file=sys.stderr)
          sys.exit(1)
          PY
